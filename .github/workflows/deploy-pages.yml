name: Deploy GitHub Pages

on:
  push:
    branches: [main, dev_hy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 联合工作区:cad-viewer 通过 link: 覆盖引用 realdwg-web 源码,
      # 需先构建 realdwg-web 的 4 个联动包(顺序同 bootstrap.mjs)。
      - name: Install realdwg-web dependencies
        working-directory: realdwg-web
        run: pnpm install

      - name: Build realdwg-web linked packages
        working-directory: realdwg-web
        run: pnpm exec nx run-many -t build -p @mlightcad/common @mlightcad/geometry-engine @mlightcad/graphic-interface @mlightcad/data-model

      - name: Install cad-viewer dependencies
        working-directory: cad-viewer
        run: pnpm install

      - name: Build cad-viewer
        working-directory: cad-viewer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build

      # copyDist.js 会把 cad-viewer/docs 复制进站点,docs 未入库,须先生成。
      - name: Build API docs
        working-directory: cad-viewer
        run: pnpm docs:build

      - name: Assemble examples site
        working-directory: cad-viewer
        run: pnpm --filter @mlightcad/cad-viewer-examples pre-serve

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cad-viewer/packages/examples/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
